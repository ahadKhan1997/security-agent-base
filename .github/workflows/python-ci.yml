name: Reusable Python DevSecOps CI

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
        description: "The targeted runtime version of Python to test against"
      working-directory:
        required: false
        type: string
        default: "."
        description: "The directory paths where target execution packages reside"
    secrets:
      MOCK_SECRET_TOKEN:
        required: false
        description: "An example placeholder demonstrating secure secret passing pipelines"

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Test Suite (Python ${{ inputs.python-version }})
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout Source Code Baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bounded Python Runtime Environment
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v6.1.0
        with:
          python-version: ${{ inputs.python-version }}
          # Removed the automatic pip cache filter to stop the requirements.txt missing error

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pydantic-settings httpx python-dotenv langchain langchain-core langchain-groq pytest ruff

      - name: Execute Code Compliance Verification (Linter)
        run: ruff check .

      - name: Execute Isolated Automated Test Framework
        env:
          PYTHONPATH: ${{ inputs.working-directory }}
          GROQ_API_KEY: "mock_key_to_satisfy_ingestion_rules"
        run: pytest

  security-scans:
    name: DevSecOps Vulnerability Audits
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Code Baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check for Accidentally Leaked Credentials (Gitleaks)
        uses: gitleaks/gitleaks-action@7cc274353d9da8d1209b55db56d4b537d94f277c # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile Container Security Layer Baseline
        run: docker build -t local-test-app:latest .

      - name: Audit Container Static Assets (Trivy)
        uses: aquasecurity/trivy-action@5112fc2374cd38e9c452e899778e244d732c5820 # v0.28.0 (Updated Verified Stable Commit SHA)
        with:
          image-ref: 'local-test-app:latest'
          format: 'table'
          exit-code: '0'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
