name: Master Delivery Orchestration CI

on:
  push:
    branches: [ main, master, development ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trigger-devsecops-matrix:
    name: Launch Reusable Pipeline Array
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    
    uses: ./.github/workflows/python-ci.yml
    with:
      python-version: ${{ matrix.python-version }}
      # Crucial Adjustment: Set this explicitly to point to your project subdirectory folder
      working-directory: "."
